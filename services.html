<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catering Services</title>
<link rel="stylesheet" href="style.css">
<style>
/* ================= BODY ================= */
body {
  font-family: 'Poppins', sans-serif;
  background: #fff5f5;
  margin: 0;
  padding: 20px;
  color: #333;
  text-align: center;
}

h2 {
  margin-bottom: 30px;
  font-size: 2em;
  color: #ff6b6b;
  opacity: 0;
  animation: fadeInUp 1s forwards;
  animation-delay: 0.3s;
}

/* ================= GRID LAYOUT ================= */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  justify-items: center;
  margin-bottom: 30px;
}

/* ================= CARD ================= */
.card {
  background: #fff;
  border-radius: 12px;
  padding: 40px 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  font-size: 1.2em;
  font-weight: 600;
  color: #ff6b6b;
  width: 100%;
  max-width: 250px;
  transition: transform 0.3s, box-shadow 0.3s, opacity 0.3s;
  cursor: pointer;
  opacity: 0;
  animation: fadeInUp 1s forwards;
}

.card:nth-child(1) { animation-delay: 0.6s; }
.card:nth-child(2) { animation-delay: 0.9s; }
.card:nth-child(3) { animation-delay: 1.2s; }

.card:hover {
  transform: translateY(-10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

/* ================= BUTTON ================= */
.btn {
  display: inline-block;
  background: #ff6b6b;
  color: white;
  padding: 15px 30px;
  border-radius: 12px;
  font-size: 1.1em;
  font-weight: bold;
  text-decoration: none;
  transition: transform 0.3s, background 0.3s, opacity 0.3s;
  opacity: 0;
  animation: fadeInUp 1s forwards;
  animation-delay: 1.5s;
}

.btn:hover {
  background: #ff3b3b;
  transform: scale(1.05);
}

/* ================= ANIMATIONS ================= */
@keyframes fadeInUp {
  0% {
    opacity: 0;
    transform: translateY(50px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ================= MOBILE RESPONSIVE ================= */
@media(max-width:600px){
  h2 { font-size: 1.5em; }

  .card {
    padding: 30px 15px;
    font-size: 1em;
    max-width: 100%;
  }

  .btn {
    width: 90%;
    padding: 12px;
    font-size: 1em;
  }
}
</style>
</head>
<body>

<h2>Our Catering Services</h2>

<div class="grid">
  <div class="card">Wedding Catering</div>
  <div class="card">Birthday Catering</div>
  <div class="card">Corporate Events</div>
</div>

<div>
  <a href="contact.html" class="btn">Apply For Service</a>
</div>

</body>
</html>
