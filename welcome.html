/* ================= WELCOME PAGE STYLING ================= */
body.welcome {
  background: linear-gradient(to right, #ffecd2, #fcb69f);
  font-family: 'Poppins', sans-serif;
  text-align: center;
  padding: 50px 20px;
  color: #333;
  overflow-x: hidden;
}

h1, h2 {
  margin: 10px 0;
  opacity: 0;
  animation: fadeInUp 1s forwards;
}

h1 {
  font-size: 3em;
  animation-delay: 0.3s;
}

h2:nth-of-type(1) { animation-delay: 0.8s; }
h2:nth-of-type(2) { animation-delay: 1.2s; }
h2:nth-of-type(3) { animation-delay: 1.6s; }

.social-icons {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 20px 0;
  opacity: 0;
  animation: fadeInUp 1s forwards;
  animation-delay: 2s;
}

.social-icons a {
  transition: transform 0.3s, opacity 0.3s;
}

.social-icons a:hover {
  transform: scale(1.3) rotate(10deg);
  opacity: 0.9;
}

/* Home button animation */
.home-btn {
  display: inline-block;
  margin-top: 30px;
  padding: 15px 30px;
  background: #FF6B6B;
  color: white;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
  font-size: 1.2em;
  opacity: 0;
  transform: translateY(50px);
  animation: fadeInUp 1s forwards;
  animation-delay: 3s;
  transition: transform 0.3s, background 0.3s;
}

.home-btn:hover {
  transform: translateY(0px) scale(1.1);
  background: #ff3b3b;
}

/* ================= ANIMATIONS ================= */
@keyframes fadeInUp {
  0% {
    opacity: 0;
    transform: translateY(50px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>
