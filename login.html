<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Cake Factory Lagos</title>
<link rel="stylesheet" href="style.css">
<style>
/* ================= BODY ================= */
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to right, #ffecd2, #fcb69f);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
  color: #333;
}

/* ================= FORM CONTAINER ================= */
form {
  background: #fff;
  padding: 40px 30px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  width: 100%;
  max-width: 400px;
  text-align: center;
  opacity: 0;
  transform: translateY(50px);
  animation: fadeInUp 1s forwards;
}

/* ================= HEADING ================= */
form h2 {
  margin-bottom: 30px;
  color: #ff6b6b;
  font-size: 2em;
}

/* ================= INPUTS ================= */
form input {
  width: 90%;
  padding: 12px 15px;
  margin: 12px 0;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 1em;
  transition: border 0.3s, box-shadow 0.3s;
}

form input:focus {
  border-color: #ff6b6b;
  box-shadow: 0 0 8px rgba(255,107,107,0.4);
  outline: none;
}

/* ================= BUTTON ================= */
.btn {
  width: 95%;
  padding: 15px;
  margin-top: 20px;
  background: #ff6b6b;
  color: white;
  font-weight: bold;
  font-size: 1.1em;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.3s, transform 0.3s;
}

.btn:hover {
  background: #ff3b3b;
  transform: scale(1.05);
}

/* ================= SIGNUP LINK ================= */
p {
  margin-top: 20px;
  font-size: 0.9em;
}

p a {
  color: #ff6b6b;
  text-decoration: none;
  font-weight: bold;
  transition: color 0.3s;
}

p a:hover {
  color: #ff3b3b;
}

/* ================= ANIMATION ================= */
@keyframes fadeInUp {
  0% {
    opacity: 0;
    transform: translateY(50px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ================= RESPONSIVE ================= */
@media(max-width:480px){
  form {
    padding: 30px 20px;
  }

  form h2 {
    font-size: 1.6em;
  }

  form input {
    width: 100%;
    font-size: 0.95em;
  }

  .btn {
    width: 100%;
    padding: 12px;
    font-size: 1em;
  }
}
</style>
</head>
<body>

<form>
  <h2>Login</h2>
  <input id="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">
  <button type="button" class="btn" onclick="login()">Login</button>
  <p>No account? <a href="signup.html">Sign up</a></p>
</form>

<script src="script.js"></script>
</body>
</html>
