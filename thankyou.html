<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You - Cake Factory Lagos</title>
<link rel="stylesheet" href="style.css">

<style>
/* ================= BODY ================= */
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(to right, #ffecd2, #fcb69f);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
  text-align: center;
  color: #333;
}

/* ================= CONTAINER ================= */
.thankyou-container {
  background: #fff;
  padding: 50px 30px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  opacity: 0;
  transform: translateY(50px);
  animation: fadeInUp 1s forwards;
}

/* ================= HEADING ================= */
h1 {
  font-size: 2.5em;
  color: #ff6b6b;
  margin-bottom: 20px;
}

/* ================= PARAGRAPH ================= */
p {
  font-size: 1.2em;
  margin-bottom: 30px;
}

/* ================= BUTTON ================= */
.btn {
  display: inline-block;
  background: #ff6b6b;
  color: white;
  padding: 15px 35px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
  font-size: 1.1em;
  transition: transform 0.3s, background 0.3s;
}

.btn:hover {
  transform: scale(1.1);
  background: #ff3b3b;
}

/* ================= ANIMATION ================= */
@keyframes fadeInUp {
  0% {
    opacity: 0;
    transform: translateY(50px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ================= RESPONSIVE ================= */
@media(max-width:480px){
  .thankyou-container {
    padding: 40px 20px;
  }

  h1 {
    font-size: 2em;
  }

  p {
    font-size: 1em;
  }

  .btn {
    width: 90%;
    padding: 12px;
    font-size: 1em;
  }
}
</style>
</head>
<body>

<div class="thankyou-container">
  <h1>🎉 Thank You!</h1>
  <p>Your order has been submitted successfully.</p>
  <a href="home.html" class="btn">Back Home</a>
</div>

</body>
</html>
