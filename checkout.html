<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">

        <!-- VERY IMPORTANT FOR MOBILE -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Checkout</title>

        <!-- CSS -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body onload="loadCheckout()">

        <form action="https://formspree.io/f/xvzbpnoj" method="POST">

            <input type="hidden" name="_redirect" value="thankyou.html">

            <h2>Checkout</h2>

            <input name="name" placeholder="Full Name" required>
            <input name="phone" placeholder="Phone" required>
            <input name="address" placeholder="Address" required>

            <!-- Auto-filled order summary -->
            <textarea id="orderBox" name="Order Details" readonly></textarea>

            <button class="btn">Submit Order</button>

        </form>

        <!-- JS must be last -->
        <script src="script.js"></script>

    </body>
</html>
